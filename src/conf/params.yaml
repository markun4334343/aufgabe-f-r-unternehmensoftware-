DATA_ACQUISITON:
  # The absolute path where the parquet files will be saved.
  # We use forward slashes (/) to prevent Windows path errors.
  DATA_PATH: "C:/Users/rakun/Desktop/projket fur unternehmenssofware/etherium projekt/src/Data"

  # Date range for fetching raw data
  START_DATE: "2020-01-01"
  END_DATE: "2025-06-25"

MODEL_CONFIG:
  # The target prediction horizons (h) in minutes
  PREDICTION_HORIZONS: [15, 60, 240, 1440]

  # The threshold for volatility (1.5x standard deviation)
  VOLATILITY_THRESHOLD: 1.5

  # Windows for moving averages and normalization (t)
  LOOKBACK_WINDOWS: [5, 10, 15, 20, 30, 60, 120, 240, 360, 480, 720, 960, 1200]

  # Specific settings for feature engineering
  FEATURES:
    USE_VWAP: True
    USE_GAS_FEES: True
    USE_FUNDING_RATE: True